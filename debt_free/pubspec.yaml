name: debt_free
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  csv: ^6.0.0
  file_picker: ^8.0.3
  crypto: ^3.0.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  fl_chart: ^1.3.1
  flutter_inappwebview: ^6.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#0E7C47"
  image: "assets/icon/app_icon_adaptive.jpg"
  ios: false
  web: false
  android_12:
    color: "#0E7C47"
    image: "assets/icon/app_icon_adaptive.jpg"
    icon_background_color: "#0E7C47"


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.jpg"
  # Android Adaptive Icon
  adaptive_icon_background: "#0E7C47"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive.jpg"

  # Windows Desktop
  windows:
    generate: true
    image_path: "assets/icon/app_icon.jpg"
    icon_size: 48 #standard size

  remove_alpha_ios: true

flutter:
  uses-material-design: true
